name: Fetch Images -> WebP -> Release

on:
  workflow_dispatch:
    inputs:
      links:
        description: "Links, space or comma separated. Leave EMPTY to use links.txt"
        required: false
        default: ""
      max_quality:
        description: "Highest WebP quality tried for JPEG/HEIC/AVIF sources (goes lower only if needed to be smaller than the source)"
        type: choice
        options: ["95", "90", "85"]
        default: "95"
      lossless_sources:
        description: "PNG/BMP/TIFF/GIF sources: keep-lossless = zero quality loss, lossy = smaller zip"
        type: choice
        options: ["keep-lossless", "lossy"]
        default: "keep-lossless"
      append:
        description: "Keep previous releases. Off = replace them."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove previous release batches
        if: inputs.append != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' \
            | { grep '^run-' || true; } \
            | xargs -r -n1 gh release delete --repo "$GITHUB_REPOSITORY" --cleanup-tag -y

      - name: Plan jobs (one job per link)
        id: m
        env:
          INPUT_LINKS: ${{ inputs.links }}
        run: python3 scripts/plan.py

  fetch:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (big albums need room)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -q -U gallery-dl pillow pillow-heif

      - name: Download images + convert to WebP + zip
        env:
          URL: ${{ matrix.url }}
          IDX: ${{ matrix.idx }}
          MAX_QUALITY: ${{ inputs.max_quality }}
          LOSSLESS_SOURCES: ${{ inputs.lossless_sources }}
          COOKIES: ${{ secrets.COOKIES }}
        run: python scripts/fetch.py "$URL" "$IDX"

      - name: Publish release (title + zip)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          ZIP="$(ls out/*.zip | head -n1)"
          NAME="$(basename "$ZIP")"
          TITLE="$(cat out/title.txt)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title="$TITLE" --notes-file out/notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title="$TITLE" \
              --notes-file out/notes.md --target "$GITHUB_SHA"
          fi

          ok=0
          for try in 1 2 3; do
            if gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber; then ok=1; break; fi
            echo "upload failed, retry $try"; sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::upload failed after 3 tries"; exit 1; }

          # verify GitHub really holds the full file
          LOCAL="$(stat -c%s "$ZIP")"
          REMOTE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                    -q ".assets[] | select(.name==\"$NAME\") | .size")"
          [ "$LOCAL" = "$REMOTE" ] || { echo "::error::size mismatch (local $LOCAL, remote ${REMOTE:-none})"; exit 1; }

          {
            echo "### $TITLE"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
